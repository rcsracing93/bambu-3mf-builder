studio  = "2.8.2"
output  = "f4tl.3mf"
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.16mm Optimal @BBL X1C"

# Same as the stock Studio save this job is compared with (the builder defaults to rectilinear)
[settings]
infill_pattern = "grid"
# smooth timelapse: Print::has_wipe_tower() is true, so the plate has a prime tower even with one filament
timelapse_type = "1"
[[filament]]
preset = "Bambu PLA Basic @BBL P1S 0.4 nozzle"
color = "#111111"
[[filament]]
preset = "Bambu PLA Matte @BBL P1S 0.4 nozzle"
color = "#FFFFFF"
[[filament]]
preset = "Bambu PLA Basic @BBL P1S 0.4 nozzle"
color = "#C12E1F"
[[filament]]
preset = "Bambu PLA Basic @BBL P1S 0.4 nozzle"
color = "#0A2989"
[[object]]
name = "Cube"
[[object.part]]
mesh = "../data/cube20.stl"
filament = 1
