studio  = "2.8.2"
output  = "calibration_tower.3mf"
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"

[[filament]]
preset = "Bambu PLA Basic @BBL P1S 0.4 nozzle"
color = "#FF8000"

# The builder makes the tower: no [[object]] needed. The range is the preset's nozzle temperature +-10 C in 5 C steps (five bands),
# highest at the bottom. Or give start / end / step instead of center / plus_minus / step.
[temperature_tower]
shape = "calibration"
