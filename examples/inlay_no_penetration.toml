studio  = "2.9.2"
output  = "inlay_no_penetration.3mf"
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"

[[filament]]
preset = "Bambu PLA Basic @BBL P1S 0.4 nozzle"
color = "#F2F2F2"

[[filament]]
preset = "Bambu PLA Basic @BBL P1S 0.4 nozzle"
color = "#C12E1F"

# Acts only on color painted in Studio. These parts are not painted, so the tool paths are the same with it on or off.
[[object]]
name = "Body and inlay"
[object.settings]
color_penetration_cross_parts = false
[[object.part]]
name = "Body"
mesh = "data/slab1.stl"
filament = 1
[[object.part]]
name = "Inlay"
mesh = "data/slab2.stl"
filament = 2
